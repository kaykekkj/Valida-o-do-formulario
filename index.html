<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de cadastro e login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main">

        <section class="selecione">

            <div class="modal-cadastro">

                <form id="formCadastro" novalidate>

                    <h1>Cadastro</h1>

                    <h2>Dados pessoais</h2>

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                    >


                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        inputmode="numeric"
                        maxlength="14"
                        autocomplete="off"
                    >


                    <label for="nascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                    >


                    <label for="sexo">
                        Sexo
                    </label>

                    <select id="sexo" name="sexo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="masculino">
                            Masculino
                        </option>

                        <option value="feminino">
                            Feminino
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>


                    <h2>Contato</h2>

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                    >


                    <label for="celular">
                        Celular
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        inputmode="numeric"
                        maxlength="15"
                        autocomplete="tel"
                    >


                    <h2>Endereço</h2>

                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        inputmode="numeric"
                        maxlength="9"
                        autocomplete="postal-code"
                        placeholder="00000-000"
                    >


                    <label for="estado">
                        Estado (UF)
                    </label>

                    <select
                        id="estado"
                        name="estado"
                    >

                        <option value="">
                            Selecione
                        </option>

                    </select>


                    <label for="cidade">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        list="cidades"
                        autocomplete="address-level2"
                    >

                    <datalist id="cidades"></datalist>


                    <label for="logradouro">
                        Logradouro
                    </label>

                    <input
                        type="text"
                        id="logradouro"
                        name="logradouro"
                        autocomplete="address-line1"
                    >


                    <label for="numero">
                        Número
                    </label>

                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        inputmode="numeric"
                        autocomplete="address-line2"
                    >


                    <label for="complemento">
                        Complemento
                    </label>

                    <input
                        type="text"
                        id="complemento"
                        name="complemento"
                    >


                    <label for="bairro">
                        Bairro
                    </label>

                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                    >


                    <label class="aceite">

                        <input
                            type="checkbox"
                            id="aceite"
                            name="aceite"
                        >

                        <span>
                            Aceito a declaração e confirmo que
                            as informações fornecidas são verdadeiras.
                        </span>

                    </label>


                    <button type="submit">
                        Cadastrar
                    </button>

                    <button
                        type="reset"
                        id="limpar"
                    >
                        Limpar formulário
                    </button>

                </form>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
